<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AutoDocs"><link rel="manifest" href="manifest.webmanifest"><title>AutoDocs</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#f8fafc;background:#101827}body{margin:0;padding:env(safe-area-inset-top) 18px 40px}header{display:flex;justify-content:space-between;align-items:center;padding:25px 0 15px}h1{font-size:28px;margin:0}h2{font-size:20px}small,.muted{color:#94a3b8}.card{background:#202d42;border-radius:18px;padding:18px;margin:12px 0}button,.btn{background:#3578ed;border:0;border-radius:11px;padding:12px 15px;color:white;font-size:15px;font-weight:600;cursor:pointer}button.secondary{background:#35445c}button.danger{background:#7f3140}input,select{background:#0e192a;color:white;border:1px solid #526078;border-radius:10px;padding:12px;box-sizing:border-box;width:100%;font-size:16px;margin:7px 0 12px}label{font-size:13px;color:#cbd5e1}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.hidden{display:none}.doc{border-top:1px solid #3b4b61;padding:14px 0}.tag{color:#a7e6c0}.warning{color:#fbbf24}.photo{width:100%;max-height:190px;object-fit:cover;border-radius:12px;margin:8px 0}a{color:#93c5fd}#status{font-size:12px;color:#94a3b8;margin-top:12px}dialog{background:#202d42;color:white;border:0;border-radius:16px;width:calc(100% - 40px);max-width:440px}dialog::backdrop{background:#0009}</style></head><body><header><div><small>Tu billetera vehicular</small><h1>AutoDocs 🚘</h1></div><button id="addCar">+ Vehículo</button></header><main id="app"></main><div id="status"></div><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="secondary" id="closeModal">Cerrar</button></dialog><script src="app.js"></script></body></html>
